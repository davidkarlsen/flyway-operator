apiVersion: v1
entries:
  flyway-operator:
  - annotations:
      artifacthub.io/changes: |
        - kind: changed
          description: "Operator 0.7.0. Apply the 0.7.0 CRD before helm upgrade: Helm does not update crds/"
        - kind: added
          description: "RBAC for pods list, events list and pods/log get: the operator reports why a pod does not start, Flyway's error and the schema version"
        - kind: added
          description: "Optional Grafana dashboards (grafana.dashboards.enabled): a ConfigMap and, when grafana-operator is installed, GrafanaDashboards"
        - kind: added
          description: "Optional PrometheusRule with the operator's alerts (prometheusRule.enabled)"
        - kind: changed
          description: "Values are now validated against values.schema.json: a wrong type or an unknown key fails install and upgrade"
      artifacthub.io/crds: |
        - kind: Migration
          version: v1alpha1
          name: migrations.flyway.davidkarlsen.com
          displayName: Migration
          description: Declarative Flyway database migration, run as a Kubernetes Job.
      artifacthub.io/crdsExamples: |
        - apiVersion: flyway.davidkarlsen.com/v1alpha1
          kind: Migration
          metadata:
            name: my-app
          spec:
            database:
              username: myuser
              credentials:
                name: my-app-db
                key: password
              jdbcUrl: "jdbc:postgresql://my-db:5432/my_app"
            retryLimit: 2
            migrationSource:
              imageRef: "registry.example.com/my-app-sql:1.4.0"
            flywayConfiguration: {}
      artifacthub.io/images: |
        - name: flyway-operator
          image: ghcr.io/davidkarlsen/flyway-operator:0.7.0
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://github.com/davidkarlsen/flyway-operator/tree/main/docs
        - name: Installing
          url: https://github.com/davidkarlsen/flyway-operator/blob/main/docs/installing.md
        - name: Usage
          url: https://github.com/davidkarlsen/flyway-operator/blob/main/docs/usage.md
        - name: Metrics and alerts
          url: https://github.com/davidkarlsen/flyway-operator/blob/main/docs/metrics.md
        - name: Dashboards
          url: https://github.com/davidkarlsen/flyway-operator/blob/main/docs/dashboards.md
        - name: Verifying releases
          url: https://github.com/davidkarlsen/flyway-operator/blob/main/docs/verifying.md
        - name: Source
          url: https://github.com/davidkarlsen/flyway-operator
      artifacthub.io/operator: "true"
      artifacthub.io/operatorCapabilities: Deep Insights
