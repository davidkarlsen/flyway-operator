# Alerts for the operator and its Migrations.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: prometheusrule
    app.kubernetes.io/instance: controller-manager-alerts
    app.kubernetes.io/component: metrics
    app.kubernetes.io/created-by: flyway-operator
    app.kubernetes.io/part-of: flyway-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-alerts
  namespace: system
spec:
  groups:
    - name: flyway-operator.operator
      rules:
        - alert: FlywayOperatorMetricsAbsent
          expr: absent(up{job=~".*flyway-operator.*"} == 1)
          for: 10m
          labels:
            severity: warning
            alert_audience: platform
          annotations:
            summary: No flyway-operator metrics target is up.
            description: >-
              Prometheus has no up flyway-operator scrape target for 10m, so no Migration alert can fire.
              Check the operator pod and the ServiceMonitor, and that Prometheus is bound to the metrics-reader ClusterRole.
        - alert: FlywayOperatorReconcileErrors
          expr: |
            sum by (namespace) (rate(controller_runtime_reconcile_errors_total{controller="migration"}[15m]))
              / sum by (namespace) (rate(controller_runtime_reconcile_total{controller="migration"}[15m])) > 0.1
          for: 15m
          labels:
            severity: warning
            alert_audience: platform
          annotations:
            summary: More than 10% of Migration reconciles fail.
            description: >-
              {{ $value | humanizePercentage }} of Migration reconciles failed over the last 15m.
              Check the operator logs.
    - name: flyway-operator.migrations
      rules:
        - alert: FlywayMigrationFailed
          expr: |
            max by (namespace, migration) (
              flyway_operator_migration_status_condition{condition="Failed", status="true"}
            ) == 1
          for: 1m
          keep_firing_for: 5m
          labels:
            severity: warning
            alert_audience: workload
          annotations:
            summary: Migration {{ $labels.namespace }}/{{ $labels.migration }} failed and is not retried.
            description: >-
              retryLimit is exhausted (condition reason TimedOut when the last attempt exceeded spec.activeDeadline,
              else RetryLimitExceeded), or the cluster does not support image volumes (ImageVolumeUnsupported).
              Check `kubectl -n {{ $labels.namespace }} describe migration {{ $labels.migration }}`
              and `kubectl -n {{ $labels.namespace }} logs job/{{ $labels.migration }} -c flyway`.
              A spec change starts a new run.
        - alert: FlywayMigrationStuck
          expr: |
            max by (namespace, migration) (
              flyway_operator_migration_status_condition{condition="Progressing", status="true"}
            ) == 1
            and on (namespace, migration)
            time() - max by (namespace, migration) (
              flyway_operator_migration_status_condition_last_transition_timestamp_seconds{condition="Progressing"}
            ) > 3600
            unless on (namespace, migration) max by (namespace, migration) (flyway_operator_migration_paused) == 1
          for: 5m
          keep_firing_for: 5m
          labels:
            severity: warning
            alert_audience: workload
          annotations:
            summary: Migration {{ $labels.namespace }}/{{ $labels.migration }} has been progressing for more than 1h.
            description: >-
              The Job may be waiting on a database lock, an unreachable database or an unschedulable pod.
              Check `kubectl -n {{ $labels.namespace }} describe migration {{ $labels.migration }}` and the Job's pods.
