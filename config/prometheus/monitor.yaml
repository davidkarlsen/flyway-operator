
# Prometheus Monitor Service (Metrics)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: servicemonitor
    app.kubernetes.io/instance: controller-manager-metrics-monitor
    app.kubernetes.io/component: metrics
    app.kubernetes.io/created-by: flyway-operator
    app.kubernetes.io/part-of: flyway-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      # keep the namespace label of the flyway_operator_migration_* series (the Migration's namespace)
      honorLabels: true
      port: https # Ensure this is the name of the port that exposes HTTPS metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # The metrics server uses a self-signed certificate generated by controller-runtime.
        # [PROMETHEUS-WITH-CERTS] When cert-manager issues the metrics certificate, replace
        # insecureSkipVerify with a CA and serverName, for example:
        #   ca:
        #     secret:
        #       name: metrics-server-cert
        #       key: ca.crt
        #   serverName: flyway-operator-controller-manager-metrics-service.flyway-operator-system.svc
        insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/part-of: flyway-operator
