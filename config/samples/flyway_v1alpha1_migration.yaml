# Pre-filled example for the OLM "Create Migration" form (CSV alm-examples, generated by `make bundle`).
# It is the required subset of the documented example in docs/usage.md, with the same values;
# internal/controller/docs_examples_test.go fails if the two drift apart or stop validating.
apiVersion: flyway.davidkarlsen.com/v1alpha1
kind: Migration
metadata:
  name: my-app
spec:
  database:
    username: myuser
    credentials:
      name: my-app-db
      key: password
    jdbcUrl: "jdbc:postgresql://my-db:5432/my_app"
  retryLimit: 2
  migrationSource:
    imageRef: "registry.example.com/my-app-sql:1.4.0"
  flywayConfiguration: {}
