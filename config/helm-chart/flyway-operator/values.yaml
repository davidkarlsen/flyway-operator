# Default values for flyway-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# @schema.root
# patternProperties:
#   "^common$":
#     type: object
#     description: Values of the Bitnami common library chart, added by Helm. Not used by this chart.
# @schema.root
replicaCount: 1

image:
  registry: ghcr.io
  repository: davidkarlsen/flyway-operator
  # @schema
  # type: string
  # enum: [IfNotPresent, Always, Never]
  # @schema
  pullPolicy: IfNotPresent
  # @schema
  # type: [string, number]
  # @schema
  tag: 0.7.0
  # Image digest, e.g. sha256:<hash>. When set, it replaces the tag in the image reference.
  digest: ""

# @schema
# type: array
# items:
#   type: object
#   properties:
#     name:
#       type: string
# @schema
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  # Required when create is false (rendering fails otherwise, so the operator's
  # ClusterRole is never bound to the namespace default ServiceAccount).
  name: ""

# @schema
# type: object
# additionalProperties: true
# @schema
podAnnotations: {}

# @schema
# type: object
# additionalProperties: true
# @schema
podSecurityContext: {}
  # fsGroup: 2000

# @schema
# type: object
# additionalProperties: true
# @schema
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # @schema
  # type: string
  # enum: [ClusterIP, NodePort, LoadBalancer]
  # @schema
  type: ClusterIP
  # @schema
  # type: [integer, string]
  # @schema
  port: 80

metrics:
  # Serve /metrics over HTTPS, protected by Kubernetes authn/authz (TokenReview + SubjectAccessReview).
  # Scrapers need a ServiceAccount bound to the <fullname>-metrics-reader ClusterRole.
  enabled: true
  port: 8443
  serviceMonitor:
    # Opt-in: requires the monitoring.coreos.com/v1 CRDs (Prometheus Operator).
    # The ServiceMonitor is only rendered when the cluster serves that API; if it does not, it is
    # skipped (not failed) so `helm template` works without a cluster, and a warning is shown in
    # the install notes. For offline rendering / GitOps without cluster access pass
    # `--api-versions monitoring.coreos.com/v1/ServiceMonitor` to `helm template`.
    enabled: false
    # Scrape interval, e.g. 30s. Empty uses the Prometheus default.
    interval: ""
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # The endpoint sets honorLabels: true so the `namespace` label on the operator's metrics (the
    # Migration's namespace) is kept rather than renamed to exported_namespace.
    # Extra labels on the ServiceMonitor, e.g. to match a Prometheus serviceMonitorSelector.
    labels: {}

grafana:
  dashboards:
    # Opt-in: ship the operator and Migrations dashboards as a ConfigMap (<fullname>-dashboards) with one
    # key per dashboard. See docs/dashboards.md.
    enabled: false
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # Labels on the ConfigMap; the Grafana sidecar discovers dashboards by grafana_dashboard.
    # Helm merges your values into these defaults, so `labels: {}` keeps the label. To remove it, e.g. when
    # grafana-operator imports the dashboards and a sidecar would import them again, set
    # `grafana.dashboards.labels.grafana_dashboard: null`.
    labels:
      # @schema
      # type: [string, "null"]
      # @schema
      grafana_dashboard: "1"
    grafanaDashboard:
      # Also render a GrafanaDashboard per dashboard. Only rendered when the cluster serves
      # grafana.integreatly.org/v1beta1; for `helm template` pass
      # `--api-versions grafana.integreatly.org/v1beta1`. Use one import path per Grafana: when the
      # sidecar loads the ConfigMap, set this to false.
      enabled: true
      # @schema
      # type: object
      # additionalProperties: true
      # @schema
      # Must match the labels of your Grafana resource. Immutable once created.
      instanceSelector:
        # @schema
        # type: object
        # additionalProperties: true
        # @schema
        matchLabels:
          dashboards: grafana
      # Needed when Grafana runs in another namespace. Changing it from true to false is rejected once created; recreate the GrafanaDashboard.
      allowCrossNamespaceImport: true
      # Optional Grafana folder.
      folder: ""

prometheusRule:
  # Opt-in: requires the monitoring.coreos.com/v1 CRDs (Prometheus Operator). Rendered only when the
  # cluster serves the PrometheusRule API; for offline rendering pass
  # `--api-versions monitoring.coreos.com/v1/PrometheusRule` to `helm template`.
  # The alerts (see docs/metrics.md) use the operator's metrics, so enable metrics too.
  enabled: false
  # Namespace of the PrometheusRule. Empty uses the release namespace.
  namespace: ""
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # Extra labels on the PrometheusRule, e.g. to match a Prometheus ruleSelector.
  additionalLabels: {}

# @schema
# type: object
# additionalProperties: true
# @schema
resources:
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  limits:
    # @schema
    # type: [string, number]
    # @schema
    cpu: 500m
    # @schema
    # type: [string, number]
    # @schema
    memory: 128Mi
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  requests:
    # @schema
    # type: [string, number]
    # @schema
    cpu: 10m
    # @schema
    # type: [string, number]
    # @schema
    memory: 64Mi

# @schema
# type: object
# additionalProperties: true
# @schema
nodeSelector: {}

# @schema
# type: array
# items:
#   type: object
# @schema
tolerations: []

# @schema
# type: object
# additionalProperties: true
# @schema
affinity: {}
