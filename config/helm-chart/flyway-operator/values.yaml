# Default values for flyway-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  registry: ghcr.io
  repository: davidkarlsen/flyway-operator
  pullPolicy: IfNotPresent
  tag: 0.6.0

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  # Required when create is false (rendering fails otherwise, so the operator's
  # ClusterRole is never bound to the namespace default ServiceAccount).
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

metrics:
  # Serve /metrics over HTTPS, protected by Kubernetes authn/authz (TokenReview + SubjectAccessReview).
  # Scrapers need a ServiceAccount bound to the <fullname>-metrics-reader ClusterRole.
  enabled: true
  port: 8443
  serviceMonitor:
    # Opt-in: requires the monitoring.coreos.com/v1 CRDs (Prometheus Operator).
    # The ServiceMonitor is only rendered when the cluster serves that API; if it does not, it is
    # skipped (not failed) so `helm template` works without a cluster, and a warning is shown in
    # the install notes. For offline rendering / GitOps without cluster access pass
    # `--api-versions monitoring.coreos.com/v1/ServiceMonitor` to `helm template`.
    enabled: false
    # Scrape interval, e.g. 30s. Empty uses the Prometheus default.
    interval: ""
    # The endpoint sets honorLabels: true so the `namespace` label on the operator's metrics (the
    # Migration's namespace) is kept rather than renamed to exported_namespace.
    # Extra labels on the ServiceMonitor, e.g. to match a Prometheus serviceMonitorSelector.
    labels: {}

grafana:
  dashboards:
    # Opt-in: ship the operator and Migrations dashboards as a ConfigMap (<fullname>-dashboards) with one
    # key per dashboard. See docs/dashboards.md.
    enabled: false
    # Labels on the ConfigMap; the Grafana sidecar discovers dashboards by grafana_dashboard.
    labels:
      grafana_dashboard: "1"
    grafanaDashboard:
      # Also render a GrafanaDashboard per dashboard. Only rendered when the cluster serves
      # grafana.integreatly.org/v1beta1; for `helm template` pass
      # `--api-versions grafana.integreatly.org/v1beta1`. Use one import path per Grafana: when the
      # sidecar loads the ConfigMap, set this to false.
      enabled: true
      # Must match the labels of your Grafana resource. Immutable once created.
      instanceSelector:
        matchLabels:
          dashboards: grafana
      # Needed when Grafana runs in another namespace. Changing it from true to false is rejected once created; recreate the GrafanaDashboard.
      allowCrossNamespaceImport: true
      # Optional Grafana folder.
      folder: ""

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
