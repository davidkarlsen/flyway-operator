# Default values for flyway-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  registry: ghcr.io
  repository: davidkarlsen/flyway-operator
  pullPolicy: IfNotPresent
  tag: 0.4.1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  # Required when create is false (rendering fails otherwise, so the operator's
  # ClusterRole is never bound to the namespace default ServiceAccount).
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

metrics:
  # Serve /metrics over HTTPS, protected by Kubernetes authn/authz (TokenReview + SubjectAccessReview).
  # Scrapers need a ServiceAccount bound to the <fullname>-metrics-reader ClusterRole.
  enabled: true
  port: 8443
  serviceMonitor:
    # Opt-in: requires the monitoring.coreos.com/v1 CRDs (Prometheus Operator).
    enabled: false
    # Scrape interval, e.g. 30s. Empty uses the Prometheus default.
    interval: ""
    # Extra labels on the ServiceMonitor, e.g. to match a Prometheus serviceMonitorSelector.
    labels: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
