{{- if .Values.metrics.enabled }}
# Lets the operator authenticate and authorize requests to /metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "common.names.fullname" . }}-metrics-auth
  labels: {{- include "common.labels.standard" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "common.names.fullname" . }}-metrics-auth
  labels: {{- include "common.labels.standard" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "common.names.fullname" . }}-metrics-auth
subjects:
- kind: ServiceAccount
  name: {{ include "flyway-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Bind this to the ServiceAccount that scrapes /metrics (e.g. Prometheus).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "common.names.fullname" . }}-metrics-reader
  labels: {{- include "common.labels.standard" . | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
{{- end }}
