name: "Publish charts to repo"
on:
  push:
    branches:
      - main
    tags:
      - "chart-*"
    paths:
      - "config/helm-chart/**"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # keyless cosign signing and build provenance of the released chart packages
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: add repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add bitnami-pre2022 https://raw.githubusercontent.com/bitnami/charts/eb5f9a9513d987b519f0ecd732e7031241c50328/bitnami

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          charts_dir: config/helm-chart
          # a re-run must get past existing releases to reach the signing steps
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # chart-releaser leaves the packages it released in .cr-release-packages/ and names each
      # GitHub release after the package (<chart>-<version>).
      - name: list released charts
        id: charts
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(.cr-release-packages/*.tgz)
          if [ "${#pkgs[@]}" -gt 0 ]; then
            { echo "paths<<EOF"; printf '%s\n' "${pkgs[@]}"; echo "EOF"; } >> "${GITHUB_OUTPUT}"
          fi

      - name: install cosign
        if: steps.charts.outputs.paths != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: attest charts
        id: attest
        if: steps.charts.outputs.paths != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.charts.outputs.paths }}

      - name: sign charts and upload signatures and provenance
        if: steps.charts.outputs.paths != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          for tgz in .cr-release-packages/*.tgz; do
            release="$(basename "${tgz}" .tgz)"
            cosign sign-blob --yes --bundle "${tgz}.sigstore.json" "${tgz}"
            cp "${BUNDLE_PATH}" ".cr-release-packages/${release}.intoto.jsonl"
            gh release upload "${release}" "${tgz}.sigstore.json" ".cr-release-packages/${release}.intoto.jsonl" -R "${GITHUB_REPOSITORY}" --clobber
          done
