name: build

on:
  pull_request:
    branches:
    - "*"
  push:
    branches:
    - main
    tags:
    - "v*"

jobs:
  # Decides whether the build must run. Trigger-level paths-ignore is not used:
  # it leaves the required ci-success check unreported on docs-only PRs and blocks the merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect build-relevant changes
        id: diff
        env:
          REF_TYPE: ${{ github.ref_type }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          code=true
          if [ "${REF_TYPE}" != tag ] \
             && [ -n "${BASE}" ] && [ "${BASE}" != 0000000000000000000000000000000000000000 ] \
             && files="$(git diff --name-only "${BASE}" "${HEAD}")" && [ -n "${files}" ]; then
            code=false
            while IFS= read -r f; do
              case "${f}" in
                # config/helm-chart/** is covered by chart-test.yaml.
                *.md|docs/*|config/helm-chart/*|.claude/*|.github/CODEOWNERS|LICENSE) ;;
                *) echo "build-relevant: ${f}"; code=true ;;
              esac
            done <<< "${files}"
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  build:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' && !contains(github.event.head_commit.message, 'skip ci')
    permissions:
      checks: write
      contents: write
      packages: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: fregante/setup-git-user@v2.0.2
      - name: createVersion
        run: |
          GIT_VERSION=$(git describe --tag --always --match "v*")
          echo "GIT_VERSION=${GIT_VERSION}" >> $GITHUB_ENV
          echo "VERSION=$(echo ${GIT_VERSION} | sed s/^v//)" >> $GITHUB_ENV

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          args: --timeout=10m

      - name: run tests
        run: |
          make test

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        run: |
          make docker-buildx VERSION=${{ env.VERSION }}

      - name: bundle
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          make bundle bundle-build bundle-push VERSION=${{ env.VERSION }}

      - name: catalog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          make update-catalog-template catalog-build catalog-push VERSION=${{ env.VERSION }}

          # re-tag as alpha, so that we can stick to a single channel
          echo re-tagging
          make catalog-retag VERSION=${{ env.VERSION }}

      - name: createRelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false

  # The single required status check: passes when build succeeded or was skipped
  # for a non-build change, so docs-only PRs can still auto-merge.
  ci-success:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require changes and build not failed
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=${CHANGES} build=${BUILD}"
          [ "${CHANGES}" = success ] && { [ "${BUILD}" = success ] || [ "${BUILD}" = skipped ]; }
