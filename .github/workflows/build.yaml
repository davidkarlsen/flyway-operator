name: build

on:
  pull_request:
    branches:
    - "*"
  push:
    branches:
    - main
    tags:
    - "v*"

permissions:
  contents: read

jobs:
  # Decides whether the build must run. Trigger-level paths-ignore is not used:
  # it leaves the required ci-success check unreported on docs-only PRs and blocks the merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect build-relevant changes
        id: diff
        env:
          REF_TYPE: ${{ github.ref_type }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          code=true
          if [ "${REF_TYPE}" != tag ] \
             && [ -n "${BASE}" ] && [ "${BASE}" != 0000000000000000000000000000000000000000 ] \
             && files="$(git diff --name-only "${BASE}" "${HEAD}")" && [ -n "${files}" ]; then
            code=false
            while IFS= read -r f; do
              case "${f}" in
                # config/helm-chart/** is covered by chart-test.yaml.
                *.md|docs/*|config/helm-chart/*|.claude/*|.github/CODEOWNERS|LICENSE) ;;
                *) echo "build-relevant: ${f}"; code=true ;;
              esac
            done <<< "${files}"
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  build:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' && !contains(github.event.head_commit.message, 'skip ci')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2.0.2
      - name: createVersion
        run: |
          GIT_VERSION=$(git describe --tag --always --match "v*")
          echo "GIT_VERSION=${GIT_VERSION}" >> $GITHUB_ENV
          echo "VERSION=$(echo ${GIT_VERSION} | sed s/^v//)" >> $GITHUB_ENV

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: check generated files are up to date
        run: |
          make manifests generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::generated files are stale; run make manifests generate and commit"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout=10m --build-tags e2e

      - name: run tests
        run: |
          make test

      - name: check alert rules
        run: |
          make test-rules

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        run: |
          make docker-buildx VERSION=${{ env.VERSION }}

      - name: bundle
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          make bundle bundle-build bundle-push VERSION=${{ env.VERSION }}

      # Hands the generated OLM bundle to the release job.
      - name: upload bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: |
            bundle/
            bundle.Dockerfile
          if-no-files-found: error

  # Builds and pushes the OLM catalog for a v* tag, signs and attests the pushed images and creates the
  # GitHub release. Every step can be repeated, so "Re-run failed jobs" is safe.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/davidkarlsen/flyway-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # update-catalog-template reads the v* tags
          persist-credentials: false

      # `make opm` builds the opm download URL from `go env GOOS` / `go env GOARCH`.
      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # Replace the committed bundle with the one build generated and pushed.
      - name: remove committed bundle
        run: rm -rf bundle bundle.Dockerfile

      - name: download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # catalog-template.yaml lists the releases up to the last committed entry; the bundles of later v* tags
      # (up to this one) are added in the workspace only. Nothing is committed, so a re-run starts from the same file.
      - name: catalog
        id: catalog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          make update-catalog-template catalog-build catalog-push VERSION="${VERSION}"
          # re-tag as alpha, so that we can stick to a single channel; only for the highest release tag,
          # so re-running an older tag's release cannot move alpha backwards
          highest="$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | sed -n 1p)"
          if [ "${GITHUB_REF_NAME}" = "${highest}" ]; then
            make catalog-retag VERSION="${VERSION}"
            echo "alpha=true" >> "${GITHUB_OUTPUT}"
          else
            echo "not retagging alpha: ${GITHUB_REF_NAME} is not the highest release tag (${highest})"
            echo "alpha=false" >> "${GITHUB_OUTPUT}"
          fi

      # Signing and attestation use image@digest, never tags.
      - name: resolve image digests
        id: digests
        env:
          ALPHA: ${{ steps.catalog.outputs.alpha }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          digest() {
            local d
            d="$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest)"
            [[ "${d}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest for $1: ${d}" >&2; return 1; }
            echo "${d}"
          }
          operator="$(digest "${IMAGE}:${VERSION}")"
          bundle="$(digest "${IMAGE}-bundle:v${VERSION}")"
          catalog="$(digest "${IMAGE}-catalog:v${VERSION}")"
          if [ "${ALPHA}" = true ]; then
            # alpha is the versioned catalog image pushed under a second tag
            catalog_alpha="$(digest "${IMAGE}-catalog:alpha")"
            [ "${catalog_alpha}" = "${catalog}" ] || { echo "::error::${IMAGE}-catalog:alpha (${catalog_alpha}) != v${VERSION} (${catalog})" >&2; exit 1; }
          fi
          {
            echo "version=${VERSION}"
            echo "operator=${operator}"
            echo "bundle=${bundle}"
            echo "catalog=${catalog}"
          } | tee -a "${GITHUB_OUTPUT}"

      - name: install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: sign images
        env:
          OPERATOR: ${{ steps.digests.outputs.operator }}
          BUNDLE: ${{ steps.digests.outputs.bundle }}
          CATALOG: ${{ steps.digests.outputs.catalog }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${IMAGE}@${OPERATOR}"
          cosign sign --yes "${IMAGE}-bundle@${BUNDLE}"
          cosign sign --yes "${IMAGE}-catalog@${CATALOG}"

      - name: attest operator image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digests.outputs.operator }}
          push-to-registry: true

      - name: attest bundle image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}-bundle
          subject-digest: ${{ steps.digests.outputs.bundle }}
          push-to-registry: true

      - name: attest catalog image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}-catalog
          subject-digest: ${{ steps.digests.outputs.catalog }}
          push-to-registry: true

      # Release assets: OLM bundle manifests, the pushed image digests and a checksums file,
      # with a Sigstore signature and SLSA build provenance (read by OpenSSF Scorecard Signed-Releases).
      - name: prepare release assets
        env:
          VERSION: ${{ steps.digests.outputs.version }}
          OPERATOR: ${{ steps.digests.outputs.operator }}
          BUNDLE: ${{ steps.digests.outputs.bundle }}
          CATALOG: ${{ steps.digests.outputs.catalog }}
          ALPHA: ${{ steps.catalog.outputs.alpha }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          tar -czf "dist/flyway-operator-bundle-${GITHUB_REF_NAME}.tar.gz" bundle bundle.Dockerfile
          {
            echo "${IMAGE}:${VERSION}@${OPERATOR}"
            echo "${IMAGE}-bundle:v${VERSION}@${BUNDLE}"
            echo "${IMAGE}-catalog:v${VERSION}@${CATALOG}"
            if [ "${ALPHA}" = true ]; then echo "${IMAGE}-catalog:alpha@${CATALOG}"; fi
          } > "dist/images-${GITHUB_REF_NAME}.txt"
          (cd dist && sha256sum "flyway-operator-bundle-${GITHUB_REF_NAME}.tar.gz" "images-${GITHUB_REF_NAME}.txt" > checksums.txt)
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: attest release assets
        id: attest-assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Tolerates an existing release so the job can be re-run.
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.attest-assets.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" "dist/flyway-operator-${GITHUB_REF_NAME}.intoto.jsonl"
          # notes start at the previous release tag, not at a chart-* release
          previous="$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' \
            | while read -r t; do [ "$(printf '%s\n%s\n' "${t}" "${GITHUB_REF_NAME}" | sort -V | head -n 1)" = "${t}" ] && [ "${t}" != "${GITHUB_REF_NAME}" ] && { echo "${t}"; break; }; done || true)"
          notes=(--generate-notes)
          if [ -n "${previous}" ]; then notes+=(--notes-start-tag "${previous}"); fi
          gh release create "${GITHUB_REF_NAME}" dist/* -R "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" "${notes[@]}" --verify-tag \
            || gh release upload "${GITHUB_REF_NAME}" dist/* -R "${GITHUB_REPOSITORY}" --clobber

  # Submits the release to the OpenShift Community Operators catalog: opens a PR from the owner's fork with the
  # bundle of the release just created (hack/community-release.sh). The upstream pipeline does the rest.
  # Skips pre-releases; idempotent, so "Re-run failed jobs" is safe. COMMUNITY_OPERATORS_TOKEN only reaches the
  # script step; this job's GITHUB_TOKEN can read the release only.
  community-pr:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: open community-operators-prod PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMUNITY_TOKEN: ${{ secrets.COMMUNITY_OPERATORS_TOKEN }}
        run: |
          set -euo pipefail
          hack/community-release.sh "${GITHUB_REF_NAME}"

  # Runs real Flyway Jobs against Postgres on kind (test/e2e). Runs in parallel with build.
  e2e:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' && !contains(github.event.head_commit.message, 'skip ci')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # Installs kind only; `make test-e2e` creates the cluster and its local registry.
      - name: install kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true

      - name: run e2e tests
        run: |
          make test-e2e

      - name: upload e2e logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: bin/e2e-logs/
          if-no-files-found: ignore

  # Read-only vulnerability scan. Gates PRs through ci-success but is not a dependency of the
  # build job, so a new advisory cannot block a tag release.
  govulncheck:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' && !contains(github.event.head_commit.message, 'skip ci')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  # The single required status check: passes when build and e2e succeeded or were skipped
  # for a non-build change, so docs-only PRs can still auto-merge.
  ci-success:
    needs: [changes, build, e2e, govulncheck, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require changes, build and e2e not failed
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          VULN: ${{ needs.govulncheck.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          echo "changes=${CHANGES} build=${BUILD} e2e=${E2E} govulncheck=${VULN} release=${RELEASE}"
          [ "${CHANGES}" = success ] \
            && { [ "${BUILD}" = success ] || [ "${BUILD}" = skipped ]; } \
            && { [ "${E2E}" = success ] || [ "${E2E}" = skipped ]; } \
            && { [ "${VULN}" = success ] || [ "${VULN}" = skipped ]; } \
            && { [ "${RELEASE}" = success ] || [ "${RELEASE}" = skipped ]; }
