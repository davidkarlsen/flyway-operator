apiVersion: v1
kind: Secret
metadata:
  name: postgres
stringData:
  password: e2e-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-wrong
stringData:
  password: not-the-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # restricted Pod Security: run as the image's postgres user (UID 70 in the alpine image) on a writable data dir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        emptyDir: {}
      containers:
      - name: postgres
        image: docker.io/library/postgres:17-alpine
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        env:
        - name: PGDATA # a subdirectory: postgres cannot chmod the root-owned emptyDir itself
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_USER
          value: app
        - name: POSTGRES_DB
          value: app
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres
              key: password
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "app", "-d", "app", "-h", "127.0.0.1"]
          periodSeconds: 2
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
